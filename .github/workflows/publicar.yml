# Publica la web en GitHub Pages en cada cambio de main.
#
# Se encarga también de ACTIVAR Pages la primera vez (enablement: true), así no
# hay que tocar Settings a mano. Si el despliegue falla con un error de permisos,
# hay que ir una vez a Settings -> Actions -> General -> Workflow permissions
# y marcar "Read and write permissions".

name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue cada vez, sin cancelar el que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar (y activar) Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # La web es estática: se sube el repositorio tal cual.
      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
