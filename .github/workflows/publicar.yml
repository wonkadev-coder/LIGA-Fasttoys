# Activa GitHub Pages en el repositorio, sin tener que tocar Settings a mano.
#
# El camino habitual (configure-pages + deploy-pages) no sirve la primera vez:
# esos pasos necesitan el entorno "github-pages", que no existe hasta que Pages
# está activado, así que el job ni siquiera arranca. Esto lo activa por API.
#
# Una vez activado, GitHub reconstruye la web solo en cada push a main y este
# workflow ya no hace falta.

name: Activar Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  pages: write
  contents: read

jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir a GitHub que publique main
        run: |
          codigo=$(curl -s -o /tmp/salida.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"main","path":"/"}}')

          echo "Respuesta HTTP: $codigo"
          cat /tmp/salida.json

          # 201 = activado. 409 = ya lo estaba. Ambos son buen resultado.
          if [ "$codigo" = "201" ] || [ "$codigo" = "409" ]; then
            echo "Pages activado y publicando desde main."
          else
            echo "No se ha podido activar automáticamente."
            echo "Hazlo a mano en Settings -> Pages: Source = Deploy from a branch, Branch = main, carpeta / (root)."
            exit 1
          fi
