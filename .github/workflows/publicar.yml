# Activa GitHub Pages y deja escrito el resultado en diagnostico-pages.txt.
#
# El fichero se commitea al repositorio para poder leer qué contestó la API sin
# tener que entrar en los registros de Actions. Cuando Pages esté activo, este
# workflow se puede borrar junto con el fichero.

name: Activar Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'diagnostico-pages.txt'   # evita que el propio commit lo vuelva a lanzar

permissions:
  pages: write
  contents: write

jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Intentar activar Pages
        run: |
          codigo=$(curl -s -o /tmp/respuesta.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"main","path":"/"}}')

          {
            echo "fecha: $(date -u)"
            echo "http: $codigo"
            echo "respuesta:"
            cat /tmp/respuesta.json
            echo
            echo "permisos del token para este job:"
            curl -s -I -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}" \
              | grep -i "x-accepted-github-permissions\|x-oauth-scopes" || echo "(sin cabeceras de permisos)"
          } > diagnostico-pages.txt

          cat diagnostico-pages.txt

      - name: Dejar el diagnóstico en el repositorio
        run: |
          git config user.name "Liga Fast Toys (bot)"
          git config user.email "actions@github.com"
          git add diagnostico-pages.txt
          git commit -m "Diagnóstico de la activación de Pages" || echo "sin cambios"
          git push || echo "PUSH FALLIDO: el token tampoco puede escribir en el repositorio"
